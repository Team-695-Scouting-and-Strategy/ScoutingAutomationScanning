name: Build and Release Python EXE
description: This workflow quickly builds a Python EXE using Nuitka and releases it on GitHub. Use this workflow for quick builds, as Nuitka is slower than PyInstaller and may not work with all dependencies. For optimzed production builds, use the optimized-build-exe workflow.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        if (Test-Path requirements.txt) { pip install -r requirements.txt }

    - name: Build Executable with PyInstaller
      run: pyinstaller --onefile --clean --noconsole --collect-all customtkinter --name ScoutingApp app.py

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: windows-executable
        path: dist/ScoutingApp.exe

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: dist/ScoutingApp.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}