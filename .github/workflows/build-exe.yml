name: Build and Release Python EXE

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.14' # previously used 3.12, but 3.14 is latest stable nuitka compatible version
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install nuitka
        if (Test-Path requirements.txt) { pip install -r requirements.txt }

    - name: Build Executable with Nuitka
      run: |
        python -m nuitka `
        --onefile `
        --windows-console-mode=disable `
        --msvc=latest `
        --enable-plugin=tk-inter `
        --include-package-data=customtkinter `
        --product-name="Scouting App" `
        --company-name="Team 695" `
        --output-dir=dist `
        --output-filename=ScoutingApp.exe `
        app.py

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: windows-executable
        path: dist/ScoutingApp.exe

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: dist/ScoutingApp.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}