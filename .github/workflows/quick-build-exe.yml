name: (TESTING) Build and Release Quick Pyinstaller Python EXE
description: This workflow quickly builds a Python EXE using pyinstaller and releases on github. Use this workflow for testing and development, as it is faster than the optimized-build-exe workflow, but the build will be slower and larger.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        if (Test-Path requirements.txt) { pip install -r requirements.txt }

    - name: Build Executable with PyInstaller
      run: pyinstaller --onefile --clean --noconsole --collect-all customtkinter --name ScoutingApp app.py

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: windows-executable
        path: dist/ScoutingApp.exe

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: dist/ScoutingApp.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}